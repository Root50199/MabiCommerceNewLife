name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - name: Validate release tag
        if: inputs.release-tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') {
            throw 'Use a version tag such as v0.2.0 or v0.2.0-beta.1.'
          }
          [xml]$project = Get-Content .\MabiCommerceNewLife.csproj
          if ($Matches[1] -ne $project.Project.PropertyGroup[0].Version) {
            throw 'The tag version must match Version in MabiCommerceNewLife.csproj.'
          }
      - name: Build
        run: dotnet build .\MabiCommerceNewLife.csproj -c Release
      - name: Test
        run: dotnet test .\CalculatorTests\CalculatorTests.csproj -c Release --logger trx --results-directory .\TestResults
      - name: Package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          $arguments = @{}
          if ($env:RELEASE_TAG) { $arguments.Version = $env:RELEASE_TAG.Substring(1) }
          .\tools\Package-Release.ps1 @arguments
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          retention-days: 7
